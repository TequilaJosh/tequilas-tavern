<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazerGuanas Live Overlay</title>
<!--
================================================================================
 LazerGuanas Game Hunter — Live OBS Overlay (combined panel)
================================================================================

 STABILITY ARCHITECTURE
 ----------------------
 This overlay is built to run unattended inside an OBS Browser source for hours
 or days without a restart. Every known long-session failure mode for a Chromium
 browser source is addressed here:

 1. TRANSPORT (WebSocket, never gives up)
    - Connects to the in-app server at ws://<host>/ws and receives chat + "now
      playing" + challenges as JSON pushes. No polling, no per-second full-page
      reloads (the old <meta refresh> approach thrashed the compositor and reset
      scroll/animation state every second).
    - Auto-reconnect with EXPONENTIAL BACKOFF (base 1s, capped at 30s, +jitter),
      and it NEVER stops trying. If the server is down at startup it just keeps
      retrying quietly — no permanent error screen.
    - Distinguishes an INTENTIONAL close (we set `manualClose` before closing,
      e.g. on a deliberate soft-reload) from an UNEXPECTED drop. Only unexpected
      drops trigger reconnect.
    - APPLICATION-LEVEL HEARTBEAT every 15s ({type:"ping"} -> {type:"pong"}).
      The browser WebSocket API cannot send native control-frame pings, and a
      half-open TCP socket can sit "open" silently for minutes. If a pong does
      not arrive within the timeout we force-close, which triggers reconnect.

 2. MEMORY / DOM HYGIENE
    - Visible chat is capped (CONFIG.maxMessages). Oldest rows are explicitly
      removed (node.remove()) and their dedupe keys deleted, so nothing detaches
      and lingers. We never hold references to removed nodes in closures.
    - All timers (heartbeat, pong, reconnect, maintenance, scale) have stored
      handles and are cleared on teardown / pause.

 3. OBS BROWSER-SOURCE SPECIFICS
    - visibilitychange: OBS hides the document when its scene is inactive.
      While hidden we PAUSE the heartbeat and SUPPRESS reconnect attempts
      (reconnect/timer behaviour is unreliable in a throttled background tab) and
      resume cleanly when shown again.
    - focus/blur: handled too, but ONLY to re-check the connection / re-pin
      scroll on focus. We deliberately do NOT pause on blur, because an OBS
      source is essentially never the focused window — pausing on blur would
      pause forever. visibilitychange is the authoritative signal.
    - We do NOT rely on onbeforeunload (OBS does not fire it reliably).
    - Rendering uses requestAnimationFrame; data arrives via WebSocket events.
      setTimeout/Interval are used only for time-based housekeeping (heartbeat,
      maintenance), never for rendering.

 4. CSS / RENDERING (cheap in OBS Chromium)
    - #panel is promoted to its own GPU layer (transform: translateZ(0)).
    - The message list uses `contain: layout style` to isolate reflow, and the
      scroll container uses `will-change: transform` to avoid compositor churn.
    - Animations use ONLY transform + opacity (never top/left/width/height).
    - box-shadow / filter are used only on STATIC chrome (the panel border), never
      on frequently-updated elements (chat rows, the live timer).
    - Fonts: a system font stack is used, so there is no web-font fetch and thus
      no invisible-text flash (FOIT). If you swap in a @font-face web font, give
      it `font-display: block` (see the commented stub below).

 5. ERROR BOUNDARIES
    - The message handler and the render loop are wrapped in try/catch: one
      malformed message can never kill the overlay.
    - Non-JSON or unexpected-schema frames are discarded silently (logged to the
      debug overlay only) and the overlay keeps running.
    - A toggleable DEBUG OVERLAY (Ctrl+D) shows recent errors/events so you can
      troubleshoot on the streaming machine without opening DevTools.

 6. SCROLL BEHAVIOUR
    - Auto-scroll to the newest message ONLY when the viewer is already near the
      bottom (within CONFIG.scrollThresholdPx). If someone scrolls up to read,
      we leave them there; getting back within the threshold resumes auto-scroll.
    - scrollTop is never set inside the message loop — it is debounced to once
      per animation frame.

 7. LONG-SESSION HYGIENE
    - If the page has been open longer than CONFIG.softReloadAfterMs (24h) AND
      chat has been quiet for CONFIG.quietPeriodMs (60s), it does a soft
      window.location.reload() to clear any accumulated memory drift — only ever
      during a quiet moment so nothing visible is lost.
    - Optional periodic clear of the message list every N hours
      (CONFIG.enablePeriodicClear / CONFIG.clearListIntervalHours).

 USAGE
 -----
 Add ONE OBS Browser source pointing at the app's overlay URL
 (http://localhost:3620/ by default). When opened over http:// the WebSocket URL
 is derived from the page's own host. If you instead open this file directly
 (file://), it falls back to ws://<CONFIG.fallbackHost>:<CONFIG.fallbackPort>/ws.

 All tunable values live in the CONFIG object at the very top of the <script>.
================================================================================
-->
<style>
  /* ---- Optional web font stub: if you add one, keep font-display:block ----
  @font-face {
    font-family: 'OverlayFont';
    src: url('OverlayFont.woff2') format('woff2');
    font-display: block;
  }
  ------------------------------------------------------------------------- */

  /* Bundled bonus font, served from inside the app — every user has it. */
  @font-face {
    font-family: 'MR. Saturn';
    src: url('/font/saturn.ttf') format('truetype');
    font-display: swap;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    /* Final Fantasy 1 menu look: monospace stack, no network fetch (no FOIT). */
    font-family: 'Lucida Console', 'Consolas', ui-monospace, 'Courier New', monospace;
  }

  /* Free-form layout: a fixed 1280x720 design stage scaled to fit the OBS source.
     Each block is independently positioned/sized/fonted (editable at ?edit). */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 720px;
    transform-origin: center center;
  }

  /* Final Fantasy 1 menu window: royal-blue fill, white frame with a light-blue
     inner rule (the classic FF double border). Per-element opacity from layout is
     applied to the gradient in JS (setBg). */
  .box {
    position: absolute; box-sizing: border-box;
    display: flex; flex-direction: column; overflow: hidden;
    background: linear-gradient(180deg, #1424c0 0%, #0a16a0 100%);   /* opaque default */
    border: 3px solid #ffffff; border-radius: 8px;
    box-shadow: inset 0 0 0 2px #8090e8, 0 6px 22px rgba(0, 0, 0, 0.55);
    padding: 12px 16px;
    color: #ffffff;
    font-size: 22px;                 /* per-element size from the layout; inner text uses em */
    transform: translateZ(0);
  }
  .box[hidden] { display: none; }

  /* ---- Activity feed ---- */
  .feed { display: flex; flex-direction: column; gap: 5px; overflow: hidden; flex: 1; }
  .feed-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0, 0, 0, 0.28); border-radius: 8px;
    padding: 5px 9px; line-height: 1.25;
    transition: transform 0.32s ease, opacity 0.32s ease;
  }
  .feed-row.enter { transform: translateX(-14px); opacity: 0; }
  .feed-ic { font-size: 1.05em; flex: 0 0 auto; }
  .feed-tx { font-size: 0.62em; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- Counters ---- */
  #cntRows { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .cnt-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .cnt-name { font-size: 0.72em; font-weight: 600; color: #b8c6f5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cnt-val { font-size: 1em; font-weight: 800; font-variant-numeric: tabular-nums; flex: 0 0 auto; }

  /* ---- Edit mode ---- */
  .partyHint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
               text-align: center; padding: 8px; font-size: 13px; color: #8494d8; }
  body.editing #party .partyHint { display: flex; }
  body.editing .box { cursor: move; outline: 1px dashed rgba(159, 180, 255, 0.55); }
  body.editing .box.sel { outline: 2px solid #9fb4ff; }
  .rz {
    display: none; position: absolute; right: -7px; bottom: -7px;
    width: 15px; height: 15px; border-radius: 3px;
    background: #9fb4ff; border: 2px solid #080e34; cursor: nwse-resize; z-index: 5;
  }
  body.editing .rz { display: block; }
  #editbar {
    display: none; position: fixed; left: 12px; top: 12px; z-index: 10000; width: 250px;
    background: linear-gradient(180deg, #1424c0 0%, #0a16a0 100%);
    border: 3px solid #ffffff; border-radius: 8px;
    padding: 10px 12px; color: #ffffff;
    font-family: 'Lucida Console', Consolas, monospace; font-size: 13px;
    box-shadow: inset 0 0 0 2px #8090e8, 0 4px 18px rgba(0, 0, 0, 0.6);
  }
  body.editing #editbar { display: block; }
  #editbar h4 { margin: 0 0 6px; color: #f8d878; font-size: 12px; letter-spacing: 1px; }
  #editbar #ebSel { color: #f8d878; font-weight: 700; margin-bottom: 4px; }
  #editbar label { display: block; margin: 7px 0 2px; color: #8494d8; font-size: 11px; }
  #editbar select, #editbar input[type=number] {
    width: 100%; box-sizing: border-box; background: #101a4e; color: #ffffff;
    border: 1px solid #2438a0; border-radius: 4px; padding: 4px 6px; font-size: 13px;
  }
  #editbar input[type=color] {
    width: 100%; height: 26px; background: #101a4e; border: 1px solid #2438a0; border-radius: 4px;
  }
  #editbar .hint { color: #8494d8; font-size: 11px; margin-top: 8px; line-height: 1.4; }
  #editbar .savemark { color: #9fb4ff; font-size: 11px; height: 13px; margin-top: 5px; }
  #editbar button {
    background: #1a2a6e; color: #9fb4ff; border: 1px solid #2438a0; border-radius: 4px;
    padding: 4px 9px; font-size: 12px; cursor: pointer; font-family: 'Segoe UI', sans-serif;
  }
  #editbar button:hover { background: #2438a0; color: #080e34; }
  #editbar input[type=text] {
    background: #101a4e; color: #ffffff; border: 1px solid #2438a0; border-radius: 4px;
    padding: 4px 6px; font-size: 12px; box-sizing: border-box;
  }
  #editbar .ebsplit { border-top: 1px solid #2438a0; margin-top: 10px; padding-top: 8px; }
  #editbar #ebElems .ebElemRow { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  #editbar #ebElems label {
    display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0;
    color: #ffffff; font-size: 12px; cursor: pointer;
  }
  #editbar #ebElems .ebElemRst { padding: 1px 7px; flex: 0 0 auto; }
  #editbar #ebElems input { accent-color: #9fb4ff; }
  #editbar .prow { display: flex; gap: 5px; }
  #editbar .prow input { flex: 1 1 auto; min-width: 0; }
  #editbar #ebPresetList { margin: 6px 0; }
  #editbar #ebPresetList .p { display: flex; align-items: center; gap: 5px; margin: 4px 0; }
  #editbar #ebPresetList .p .nm {
    flex: 1 1 auto; min-width: 0; color: #ffffff; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #editbar #ebPresetList .p button { padding: 2px 7px; }
  #editbar #ebReset { width: 100%; margin-top: 4px; }

  .hd {
    color: #f8d878; font-size: 0.55em; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    margin-bottom: 0.35em; display: flex; align-items: center; gap: 0.3em; flex: 0 0 auto;
  }

  .ch-empty { color: #4a5798; font-size: 0.7em; font-style: italic; }

  /* Challenges */
  #chRows { flex: 1 1 auto; overflow: hidden; }
  .ch-row { display: flex; align-items: flex-start; margin: 0.12em 0; }
  .num {
    min-width: 1.15em; height: 1.15em; border-radius: 50%;
    background: #1a2a6e; color: #9fb4ff; font-weight: 700; font-size: 0.62em;
    text-align: center; line-height: 1.15em; margin-right: 0.5em; flex: 0 0 auto;
  }
  .ch-txt { color: inherit; font-size: 0.78em; line-height: 1.25; }

  /* Live chat */
  .live-dot {
    width: 0.45em; height: 0.45em; border-radius: 50%; background: #9fb4ff;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .wrap {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding-top: 2px; will-change: transform; scrollbar-width: none;
  }
  .wrap::-webkit-scrollbar { width: 0; height: 0; }

  .msgs {
    display: flex; flex-direction: column; justify-content: flex-end;
    min-height: 100%; contain: layout style;
  }

  .row {
    margin: 0.1em 0; padding: 0.08em 0.35em; border-radius: 5px;
    font-size: 0.9em; line-height: 1.3;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .row.odd { background: rgba(0, 0, 0, 0.22); }   /* zebra striping */
  .row.enter { opacity: 0; transform: translateY(6px); }
  .avatar {
    display: inline-block; width: 1.25em; height: 1.25em; border-radius: 50%;
    overflow: hidden; vertical-align: middle; margin-right: 0.3em;
    text-align: center; line-height: 1.25em; font-size: 0.72em; font-weight: 700; color: #080e34;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    display: inline-block; font-size: 0.5em; font-weight: 700; color: #fff;
    padding: 0.05em 0.35em; border-radius: 3px; margin-right: 0.28em; vertical-align: middle;
  }
  .badge-img { height: 1em; vertical-align: middle; margin-right: 0.28em; }
  .sym { margin-right: 0.3em; font-weight: bold; }
  .user { font-weight: 700; margin-right: 0.25em; }
  .msg { color: #ffffff; word-break: break-word; }
  .emote { height: 1.2em; vertical-align: middle; margin: 0 1px; }

  /* Boxed / bubble chat mode */
  .row.bubble {
    padding: 0; margin: 0.28em 0; background: transparent !important;
    border-radius: 10px; overflow: hidden;
  }
  .bubble .bhead {
    display: flex; align-items: center; gap: 0.25em;
    padding: 0.18em 0.5em; font-weight: 700;
  }
  .bubble .bhead .user { color: #080e34 !important; }
  .bubble .bbody {
    background: rgba(0, 0, 0, 0.82); color: #fff;
    padding: 0.3em 0.55em; border-radius: 0 0 10px 10px;
    word-break: break-word;
  }

  /* Chatters list box */
  #clRows { flex: 1 1 auto; overflow: hidden; }
  .cl-row { display: flex; align-items: center; gap: 0.35em; margin: 0.14em 0; font-size: 0.8em; }
  .cl-dot { width: 0.55em; height: 0.55em; border-radius: 50%; flex: 0 0 auto; }
  .cl-dot.a { background: #35d13a; box-shadow: 0 0 5px #35d13a; }
  .cl-dot.l { background: #e0c341; box-shadow: 0 0 5px #e0c341; }
  #chatCount { margin-left: auto; color: #8494d8; font-weight: 600; }

  /* Goal bars + poll results */
  .bar-row { margin: 0.28em 0; font-size: 0.78em; }
  .bar-label { display: flex; justify-content: space-between; margin-bottom: 0.15em; }
  .bar-label .val { color: #8494d8; font-weight: 600; }
  .bar-track {
    height: 0.75em; border-radius: 0.4em; overflow: hidden;
    background: rgba(0, 0, 0, 0.45); border: 1px solid #2438a0;
  }
  .bar-fill {
    height: 100%; border-radius: 0.4em 0 0 0.4em;
    transition: width 0.45s ease;
  }
  .poll-q { font-size: 0.82em; font-weight: 700; margin: 0.1em 0 0.3em; word-break: break-word; }
  .poll-num { color: #f8d878; font-weight: 700; margin-right: 0.3em; }
  #pollState { margin-left: auto; color: #f8d878; font-weight: 700; font-size: 0.85em; }

  /* Big toast */
  #toast {
    position: fixed; left: 50%; top: 18%; transform: translateX(-50%) scale(0.8);
    max-width: 84vw; text-align: center; z-index: 8000; pointer-events: none;
    background: linear-gradient(180deg, #1424c0 0%, #0a16a0 100%);
    border: 3px solid #ffffff; border-radius: 12px;
    color: #ffffff; font-weight: 800; font-size: 44px; line-height: 1.25;
    padding: 18px 34px;
    box-shadow: inset 0 0 0 2px #8090e8, 0 10px 40px rgba(0, 0, 0, 0.7);
    opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  /* Effects */
  #fxcanvas { position: fixed; inset: 0; z-index: 7000; pointer-events: none; }
  #fximg {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.85);
    max-width: 46vw; max-height: 46vh; z-index: 7500; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #fximg.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #fxvideo {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 70vw; max-height: 70vh; z-index: 7600; pointer-events: none;
    display: none; border-radius: 10px;
  }
  #fxvideo.show { display: block; }

  /* Streamer voice-morph countdown pill */
  #morphpill {
    position: fixed; left: 50%; bottom: 6%; transform: translateX(-50%);
    z-index: 7900; pointer-events: none; display: none;
    background: linear-gradient(180deg, #1424c0 0%, #0a16a0 100%);
    border: 3px solid #ffffff; border-radius: 999px;
    color: #ffffff; font-weight: 700; font-size: 26px; padding: 10px 26px;
    box-shadow: inset 0 0 0 2px #8090e8, 0 6px 24px rgba(0, 0, 0, 0.6);
  }
  #morphpill.show { display: block; }
  #morphpill .mt { color: #f8d878; font-variant-numeric: tabular-nums; margin-left: 10px; }
  @keyframes shake {
    0%, 100% { transform: translate(-50%, -50%) scale(var(--sscale)) translate(0, 0); }
    10% { transform: translate(-50%, -50%) scale(var(--sscale)) translate(-9px, 5px); }
    30% { transform: translate(-50%, -50%) scale(var(--sscale)) translate(8px, -6px); }
    50% { transform: translate(-50%, -50%) scale(var(--sscale)) translate(-7px, -4px); }
    70% { transform: translate(-50%, -50%) scale(var(--sscale)) translate(6px, 5px); }
    90% { transform: translate(-50%, -50%) scale(var(--sscale)) translate(-4px, 2px); }
  }
  #stage.shake { animation: shake 0.55s ease-in-out 2; }

  /* Tiny connection indicator (unobtrusive; not a permanent error screen). */
  .status {
    position: absolute; top: 12px; right: 14px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #9fb4ff; opacity: 0.0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .status.show { opacity: 0.9; }
  .status.down { background: #d45a37; }

  /* Debug overlay (Ctrl+D). */
  #debug {
    display: none;
    position: absolute; inset: 8px;
    background: rgba(0, 0, 0, 0.88);
    color: #9fb4ff;
    font-family: Consolas, monospace;
    font-size: 11px;
    line-height: 1.4;
    padding: 10px 12px;
    border-radius: 10px;
    overflow: auto;
    white-space: pre-wrap;
    z-index: 9999;
  }
  #debug.show { display: block; }
  #debug .dh { color: #f8d878; font-weight: 700; margin-bottom: 6px; }
  #debug .err { color: #ff8a6a; }
</style>
</head>
<body>
  <div id="stage">
    <section id="ch" class="box">
      <div class="hd">🎡 CHALLENGES</div>
      <div id="chRows"><div class="ch-empty">spin a wheel to add challenges</div></div>
      <div class="rz" data-el="ch"></div>
    </section>

    <section id="chat" class="box">
      <div class="hd"><span class="live-dot"></span> LIVE CHAT <span id="chatCount"></span></div>
      <div id="chatWrap" class="wrap"><div id="chatMsgs" class="msgs"></div></div>
      <div class="rz" data-el="chat"></div>
    </section>

    <section id="cl" class="box" hidden>
      <div class="hd">👥 CHATTERS <span id="clCount"></span></div>
      <div id="clRows"></div>
      <div class="rz" data-el="cl"></div>
    </section>

    <section id="gl" class="box" hidden>
      <div class="hd">🎯 GOALS</div>
      <div id="glRows"></div>
      <div class="rz" data-el="gl"></div>
    </section>

    <section id="cnt" class="box" hidden>
      <div class="hd">🔢 COUNTERS</div>
      <div id="cntRows"></div>
      <div class="rz" data-el="cnt"></div>
    </section>

    <section id="poll" class="box" hidden>
      <div class="hd">📊 POLL <span id="pollState"></span></div>
      <div id="pollQ" class="poll-q"></div>
      <div id="pollRows"></div>
      <div class="rz" data-el="poll"></div>
    </section>

    <section id="feed" class="box" hidden>
      <div class="hd">📣 ACTIVITY</div>
      <div id="feedRows" class="feed"></div>
      <div class="rz" data-el="feed"></div>
    </section>

    <section id="party" class="box" hidden>
      <canvas id="partyCanvas" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
      <div id="partyHint" class="partyHint"></div>
      <div class="rz" data-el="party"></div>
    </section>

    <div id="status" class="status"></div>
  </div>

  <div id="toast"></div>
  <img id="fximg" alt=""/>
  <video id="fxvideo" playsinline></video>
  <div id="morphpill">🎙 <span class="mn"></span><span class="mt"></span></div>

  <div id="editbar">
    <h4>OVERLAY EDITOR</h4>
    <div id="ebSel">Now Playing</div>
    <label>Font</label>
    <select id="ebFont"></select>
    <label>Text size (px)</label>
    <input id="ebSize" type="number" min="8" max="200" step="1"/>
    <label>Text color</label>
    <input id="ebColor" type="color"/>
    <label>Background opacity: <span id="ebBgoVal">100%</span></label>
    <input id="ebBgo" type="range" min="0" max="100" step="5" style="width:100%; accent-color:#9fb4ff;"/>
    <div class="hint">Click a block to select it. Drag to move, drag the corner handle to resize. Changes save automatically.</div>
    <div class="savemark" id="ebSaved"></div>

    <div class="ebsplit">
      <label>Elements (on the overlay)</label>
      <div id="ebElems"></div>
    </div>

    <div class="ebsplit">
      <label>Presets (up to 10)</label>
      <div class="prow">
        <input id="ebPresetName" type="text" placeholder="preset name" maxlength="24"/>
        <button id="ebPresetSave">Save</button>
      </div>
      <div id="ebPresetList"></div>
      <button id="ebReset">↺ Reset to default</button>
    </div>
  </div>
  <div id="debug"></div>

<script>
"use strict";
(function () {
  // =========================================================================
  //  CONFIG — every tunable value lives here.
  // =========================================================================
  const CONFIG = {
    // -- Transport / where to connect when opened as a file:// (over http://
    //    the host is taken from the page URL, so these only matter for file://).
    fallbackHost: "localhost",
    fallbackPort: 3640,
    wsPath: "/ws",

    // -- Tavern Tales party overlay. The app bakes in the companion bot's base URL
    //    (derived from the Discord bot connection in Settings) so the "Party" element
    //    can fetch who's playing. Empty = bot not connected yet.
    partyBase: "",
    partyPollMs: 2500,

    // -- Reconnect (exponential backoff; never gives up).
    reconnectBaseMs: 1000,        // first retry delay
    reconnectCapMs: 30000,        // maximum retry delay
    reconnectJitterRatio: 0.30,   // +/- random jitter applied to each delay

    // -- Heartbeat (detects silent half-open sockets).
    heartbeatIntervalMs: 15000,   // send {type:"ping"} this often
    heartbeatTimeoutMs: 10000,    // close if no {type:"pong"} within this

    // -- Memory / DOM. (Doubles as "how many chat lines to show"; the app
    //    injects the user's choice here at serve time. Default 20.)
    maxMessages: 20,              // hard cap on chat rows kept in the DOM

    // -- Scroll.
    scrollThresholdPx: 50,        // within this of bottom => auto-scroll stays on

    // -- Long-session hygiene.
    maintenanceIntervalMs: 30000, // how often housekeeping runs
    softReloadAfterMs: 24 * 60 * 60 * 1000, // reload after 24h open...
    quietPeriodMs: 60 * 1000,     // ...but only after this long with no chat
    enablePeriodicClear: false,   // clear the list every N hours?
    clearListIntervalHours: 6,    // N (only used when enablePeriodicClear)

    // -- Layout: design width the overlay is authored at; OBS source size scales it.
    //    Wider for the two-column (info | chat) layout.
    designWidth: 640,

    // -- Misc.
    defaultUserColor: "#8494d8",
    showStatusDot: true,          // show the tiny connection dot
    debugMaxLines: 200,           // lines kept in the debug overlay
  };

  // =========================================================================
  //  Debug overlay + logging (Ctrl+D). Safe even before DOM is ready.
  // =========================================================================
  const dbg = {
    lines: [],
    el: null,
    visible: false,
    log(msg, isErr) {
      const ts = new Date().toISOString().slice(11, 19);
      this.lines.push({ t: ts, m: String(msg), e: !!isErr });
      if (this.lines.length > CONFIG.debugMaxLines) this.lines.shift();
      if (this.visible) this.render();
    },
    render() {
      if (!this.el) return;
      const head = '<div class="dh">DEBUG (Ctrl+D to hide) — ' +
        'state: ' + connState + '  open: ' + uptimeStr() + '</div>';
      this.el.innerHTML = head + this.lines.map(function (l) {
        return '[' + l.t + '] ' + (l.e ? '<span class="err">' + esc(l.m) + '</span>' : esc(l.m));
      }).join("\n");
      this.el.scrollTop = this.el.scrollHeight;
    },
    toggle() {
      this.visible = !this.visible;
      if (this.el) this.el.classList.toggle("show", this.visible);
      if (this.visible) this.render();
    },
  };
  function log(m) { dbg.log(m, false); }
  function logErr(m) { dbg.log(m, true); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Catch anything that escapes a try/catch so it lands in the debug overlay
  // instead of silently killing the script.
  window.addEventListener("error", function (e) {
    logErr("window.error: " + (e.message || e.error || "unknown"));
  });
  window.addEventListener("unhandledrejection", function (e) {
    logErr("unhandledrejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  // =========================================================================
  //  State
  // =========================================================================
  let ws = null;
  let connState = "init";          // init | connecting | open | closed
  let manualClose = false;         // true => an intentional close, do NOT reconnect
  let backoffStep = 0;             // exponential backoff counter
  let hidden = false;              // OBS scene inactive (document hidden)
  let pendingReconnect = false;    // a reconnect was deferred because we were hidden

  let lastStateSig = "";           // dedupe re-render of the static sections
  const renderedKeys = new Set();  // chat dedupe by stable message id
  let chatZebra = 0;               // alternate row shading counter
  function initialOf(u) { u = (u || "").trim(); return u ? u[0].toUpperCase() : "?"; }

  // Chat style: "log" (classic) or "boxes" (colored bubbles), plus the palette.
  let chatStyle = { mode: "log", colors: ["#9fb4ff", "#f8d878", "#4aa3c4", "#c44a7c", "#9146FF"] };
  let bubbleIdx = 0;               // palette rotation (per message)
  const msgStore = [];             // recent messages kept so a style switch can re-render
  let lastMessageAt = Date.now();  // for the quiet-period soft reload
  const pageStart = Date.now();
  let lastClearAt = Date.now();

  // Timer handles (all stored so they can be cleared).
  let heartbeatTimer = null;
  let pongTimer = null;
  let reconnectTimer = null;
  let maintenanceTimer = null;
  let scaleRaf = 0;
  let scrollRaf = 0;

  let autoScroll = true;           // are we pinned to the bottom?

  // DOM refs (filled on init).
  let elCh, elChRows,
      elChatWrap, elChatMsgs, elStatus;

  function uptimeStr() {
    const s = Math.floor((Date.now() - pageStart) / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + "h" + String(m).padStart(2, "0") + "m";
  }

  // =========================================================================
  //  WebSocket URL resolution
  // =========================================================================
  function wsUrl() {
    const p = location.protocol;
    if (p === "http:" || p === "https:") {
      const scheme = p === "https:" ? "wss:" : "ws:";
      return scheme + "//" + location.host + CONFIG.wsPath;
    }
    // Opened as a local file -> fall back to the configured loopback server.
    return "ws://" + CONFIG.fallbackHost + ":" + CONFIG.fallbackPort + CONFIG.wsPath;
  }

  // =========================================================================
  //  Connection lifecycle
  // =========================================================================
  function connect() {
    clearReconnect();
    if (hidden) { pendingReconnect = true; return; }   // don't connect while hidden
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return; // already busy

    connState = "connecting";
    setStatus(false);
    const url = wsUrl();
    log("connecting -> " + url);

    try {
      ws = new WebSocket(url);
    } catch (e) {
      logErr("WebSocket ctor failed: " + e.message);
      scheduleReconnect();
      return;
    }

    ws.onopen = function () {
      connState = "open";
      backoffStep = 0;            // reset backoff on a clean connect
      setStatus(true);
      log("open");
      startHeartbeat();
    };

    ws.onmessage = function (ev) {
      // Error boundary: a single bad frame must never kill the overlay.
      try {
        onFrame(ev.data);
      } catch (e) {
        logErr("frame handler threw: " + (e && e.message));
      }
    };

    ws.onerror = function () {
      // onclose always follows; let it own the reconnect decision.
      log("socket error");
    };

    ws.onclose = function (ev) {
      connState = "closed";
      stopHeartbeat();
      setStatus(false);
      if (manualClose) {
        log("closed (intentional) — not reconnecting");
        return;
      }
      log("closed (unexpected, code " + ev.code + ") — will reconnect");
      scheduleReconnect();
    };
  }

  function scheduleReconnect() {
    clearReconnect();
    if (manualClose) return;
    if (hidden) { pendingReconnect = true; return; }   // resume when shown
    const base = Math.min(CONFIG.reconnectCapMs, CONFIG.reconnectBaseMs * Math.pow(2, backoffStep));
    backoffStep++;
    const jitter = base * CONFIG.reconnectJitterRatio * (Math.random() * 2 - 1);
    const delay = Math.max(0, Math.round(base + jitter));
    log("reconnect in " + delay + "ms (step " + backoffStep + ")");
    reconnectTimer = setTimeout(connect, delay);
  }

  function clearReconnect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  }

  function send(obj) {
    if (ws && ws.readyState === 1) {
      try { ws.send(JSON.stringify(obj)); } catch (e) { logErr("send failed: " + e.message); }
    }
  }

  // ---- Heartbeat (app-level ping/pong) ----
  function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(function () {
      if (hidden) return;                          // paused while not visible
      if (!ws || ws.readyState !== 1) return;
      send({ type: "ping" });
      if (!pongTimer) {
        pongTimer = setTimeout(function () {
          logErr("heartbeat timeout — forcing reconnect");
          try { ws.close(); } catch (e) {}         // unexpected close => reconnect
        }, CONFIG.heartbeatTimeoutMs);
      }
    }, CONFIG.heartbeatIntervalMs);
  }
  function stopHeartbeat() {
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    if (pongTimer) { clearTimeout(pongTimer); pongTimer = null; }
  }
  function onPong() {
    if (pongTimer) { clearTimeout(pongTimer); pongTimer = null; }
  }

  // =========================================================================
  //  Incoming frames
  // =========================================================================
  function onFrame(raw) {
    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      logErr("non-JSON frame discarded");          // discard silently, keep running
      return;
    }
    if (!data || typeof data.type !== "string") {
      logErr("frame without type discarded");
      return;
    }

    switch (data.type) {
      case "pong":
        onPong();
        break;
      case "snapshot":
        // Full state given on (re)connect: rebuild from scratch.
        clearChat();
        if (data.layout) applyLayout(data.layout);
        if (Array.isArray(data.presets)) { presets = data.presets; if (EDIT) renderPresets(); }
        if (data.style) applyStyle(data.style);
        if (data.chatters) renderChatters(data.chatters);
        if (data.morph) showMorph(data.morph.name, data.morph.seconds);
        if (Array.isArray(data.goals)) renderGoals(data.goals);
        if (data.poll !== undefined) renderPoll(data.poll);
        if (Array.isArray(data.activity)) renderActivity(data.activity);
        if (data.state) renderState(data.state);
        if (Array.isArray(data.counters)) renderCounters(data.counters);
        if (Array.isArray(data.chat)) {
          for (let i = 0; i < data.chat.length; i++) appendMessage(data.chat[i]);
        }
        break;
      case "state":
        if (data.state) renderState(data.state);
        break;
      case "layout":
        // Live layout update pushed while editing — apply on OBS viewers, not the editor itself.
        if (!EDIT && data.layout) applyLayout(data.layout);
        break;
      case "style":
        if (data.style) applyStyle(data.style);
        break;
      case "chatters":
        if (data.chatters) renderChatters(data.chatters);
        break;
      case "goals":
        renderGoals(data.goals);
        break;
      case "counters":
        renderCounters(data.counters);
        break;
      case "poll":
        renderPoll(data.poll);
        break;
      case "activity":
        pushActivity(data.item);
        break;
      case "toast":
        showToast(data.text, !!data.confetti);
        break;
      case "effect":
        // Custom images may be routed to the dedicated effects overlay instead.
        if (!(data.target === "effects" && data.effect === "custom")) runEffect(data);
        break;
      case "video":
        if (data.target !== "effects") playVideo(data.url, data.volume);
        break;
      case "morph":
        showMorph(data.name, data.seconds);
        break;
      case "chat":
        if (Array.isArray(data.messages)) {
          for (let i = 0; i < data.messages.length; i++) appendMessage(data.messages[i]);
        }
        break;
      case "chatClear":
        clearChat();
        break;
      default:
        log("ignored frame type: " + data.type);   // unknown schema -> ignore
    }
  }

  // =========================================================================
  //  Rendering — state sections (low frequency, rebuild only when changed)
  // =========================================================================
  function renderState(s) {
    if (EDIT) return;                                // keep placeholder content while editing
    try {
      const live = !!s.live;
      const title = s.title || "";
      const elapsed = s.elapsed || "";
      const requester = s.requester || "";
      const challenges = Array.isArray(s.challenges) ? s.challenges : [];

      const sig = live + "|" + title + "|" + elapsed + "|" + requester + "|" + challenges.join("␟");
      if (sig === lastStateSig) return;            // nothing changed
      lastStateSig = sig;

      // Game changed → re-filter the counters for the new game.
      if (title !== currentGameTitle) { currentGameTitle = title; renderCounters(lastCounters); }

      // Challenges — rolled challenges appear in real time; a hint fills the empty box.
      // (Rebuild via DOM, not innerHTML, to stay XSS-safe.)
      while (elChRows.firstChild) elChRows.removeChild(elChRows.firstChild);
      if (challenges.length) {
        for (let i = 0; i < challenges.length; i++) {
          const row = document.createElement("div");
          row.className = "ch-row";
          const num = document.createElement("span");
          num.className = "num";
          num.textContent = String(i + 1);
          const txt = document.createElement("span");
          txt.className = "ch-txt";
          txt.textContent = challenges[i];
          row.appendChild(num);
          row.appendChild(txt);
          elChRows.appendChild(row);
        }
      } else {
        const hint = document.createElement("div");
        hint.className = "ch-empty";
        hint.textContent = "spin a wheel to add challenges";
        elChRows.appendChild(hint);
      }
    } catch (e) {
      logErr("renderState failed: " + (e && e.message));
    }
  }

  // =========================================================================
  //  Rendering — chat (incremental append, hard DOM cap)
  // =========================================================================
  function makeAvatar(m) {
    const av = document.createElement("span");
    av.className = "avatar";
    if (m.avatar) {
      const aimg = document.createElement("img");
      aimg.src = m.avatar;
      aimg.addEventListener("error", function () {
        if (aimg.parentNode) aimg.remove();
        av.textContent = initialOf(m.user);
        av.style.background = m.symbolColor || "#2438a0";
      });
      av.appendChild(aimg);
    } else {
      av.textContent = initialOf(m.user);
      av.style.background = m.symbolColor || "#2438a0";
    }
    return av;
  }

  function appendBadges(target, m) {
    const badges = Array.isArray(m.badges) ? m.badges : [];
    for (let bi = 0; bi < badges.length; bi++) {
      const b = badges[bi];
      if (b && b.url) {
        const im = document.createElement("img");
        im.className = "badge-img"; im.src = b.url; im.alt = b.label || "";
        im.addEventListener("error", function () { if (im.parentNode) im.remove(); });
        target.appendChild(im);
      } else if (b && b.label) {
        const sp = document.createElement("span");
        sp.className = "badge"; sp.textContent = b.label;
        sp.style.background = b.color || "#2438a0";
        target.appendChild(sp);
      }
    }
  }

  function makeBody(m, asBlock) {
    const body = document.createElement(asBlock ? "div" : "span");
    body.className = asBlock ? "bbody" : "msg";
    const segs = Array.isArray(m.segments) ? m.segments : [];
    for (let i = 0; i < segs.length; i++) {
      const seg = segs[i];
      if (seg && seg.t === "emote" && seg.url) {
        const img = document.createElement("img");
        img.className = "emote";
        img.src = seg.url;
        img.alt = seg.text || "";
        // A broken emote URL must not break the row.
        img.addEventListener("error", function () {
          if (img.parentNode) img.replaceWith(document.createTextNode(seg.text || ""));
        });
        body.appendChild(img);
      } else if (seg) {
        body.appendChild(document.createTextNode(seg.text || ""));
      }
    }
    return body;
  }

  function buildRow(m, id) {
    const row = document.createElement("div");
    row.dataset.key = id;

    if (chatStyle.mode === "boxes" && chatStyle.colors.length) {
      // Bubble: colored box with a header line and a dark message body.
      row.className = "row bubble enter";
      row.style.background = "transparent";
      const color = chatStyle.colors[bubbleIdx++ % chatStyle.colors.length];

      const head = document.createElement("div");
      head.className = "bhead";
      head.style.background = color;
      head.appendChild(makeAvatar(m));
      const sym = document.createElement("span");
      sym.className = "sym";
      sym.style.color = "#080e34";
      sym.textContent = m.symbol || "●";
      head.appendChild(sym);
      appendBadges(head, m);
      const user = document.createElement("span");
      user.className = "user";
      user.textContent = m.user || "";
      head.appendChild(user);
      row.appendChild(head);
      row.appendChild(makeBody(m, true));
    } else {
      // Classic log line with zebra striping.
      row.className = "row enter" + ((chatZebra++ % 2) ? " odd" : "");
      row.appendChild(makeAvatar(m));
      const sym = document.createElement("span");
      sym.className = "sym";
      if (m.symbolColor) sym.style.color = m.symbolColor;
      sym.textContent = m.symbol || "●";
      row.appendChild(sym);
      appendBadges(row, m);
      const user = document.createElement("span");
      user.className = "user";
      user.style.color = m.color || CONFIG.defaultUserColor;
      user.textContent = (m.user || "") + " ";
      row.appendChild(user);
      row.appendChild(makeBody(m, false));
    }
    return row;
  }

  function appendMessage(m) {
    try {
      if (!m || typeof m !== "object") return;
      const id = m.id != null ? String(m.id)
        : (m.at || "") + "|" + (m.user || "") + "|" + (m.platform || "");
      if (renderedKeys.has(id)) return;            // dedupe (snapshots overlap)
      renderedKeys.add(id);

      msgStore.push({ m: m, id: id });
      while (msgStore.length > CONFIG.maxMessages) msgStore.shift();

      const row = buildRow(m, id);
      elChatMsgs.appendChild(row);

      // Entry animation via transform/opacity only.
      requestAnimationFrame(function () { row.classList.remove("enter"); });

      enforceCap();
      lastMessageAt = Date.now();
      scheduleScroll();
    } catch (e) {
      logErr("appendMessage failed: " + (e && e.message));
    }
  }

  function applyStyle(style) {
    if (!style || typeof style !== "object") return;
    if (style.mode) chatStyle.mode = style.mode;
    if (Array.isArray(style.colors) && style.colors.length) chatStyle.colors = style.colors;
    // Re-render the kept messages in the new style.
    while (elChatMsgs.firstChild) elChatMsgs.removeChild(elChatMsgs.firstChild);
    bubbleIdx = 0; chatZebra = 0;
    for (let i = 0; i < msgStore.length; i++) {
      const e = msgStore[i];
      const row = buildRow(e.m, e.id);
      row.classList.remove("enter");
      elChatMsgs.appendChild(row);
    }
    scheduleScroll();
  }

  // ---- Chatter counts + list ----
  function renderChatters(d) {
    try {
      if (!d || typeof d !== "object") return;
      const cnt = document.getElementById("chatCount");
      if (cnt) {
        if (d.showCount && (d.onOverlay || EDIT)) {
          if (d.perSourceMode && Array.isArray(d.perSource) && d.perSource.length) {
            cnt.textContent = "";
            for (let i = 0; i < d.perSource.length; i++) {
              const s = d.perSource[i];
              const sp = document.createElement("span");
              sp.style.color = s.symbolColor || "#8494d8";
              sp.style.marginLeft = i ? "0.45em" : "0";
              sp.textContent = (s.symbol || "●") + " " + s.count;
              cnt.appendChild(sp);
            }
          } else {
            cnt.textContent = "· " + (d.total || 0);
          }
        } else {
          cnt.textContent = "";
        }
      }

      lastChattersData = d;
      const cl = document.getElementById("cl");
      if (cl) cl.hidden = EDIT ? !isOn("cl") : !(d.showList && isOn("cl"));
      const clCount = document.getElementById("clCount");
      if (clCount) clCount.textContent = d.total ? "(" + d.total + ")" : "";
      const rowsEl = document.getElementById("clRows");
      if (rowsEl) {
        while (rowsEl.firstChild) rowsEl.removeChild(rowsEl.firstChild);
        const list = Array.isArray(d.list) ? d.list : [];
        for (let i = 0; i < list.length; i++) {
          const c = list[i];
          const row = document.createElement("div");
          row.className = "cl-row";
          const dot = document.createElement("span");
          dot.className = "cl-dot " + (c.s === "l" ? "l" : "a");
          row.appendChild(dot);
          const sym = document.createElement("span");
          sym.style.color = c.symbolColor || "#8494d8";
          sym.textContent = c.symbol || "●";
          row.appendChild(sym);
          const nm = document.createElement("span");
          nm.textContent = c.u || "";
          row.appendChild(nm);
          rowsEl.appendChild(row);
        }
      }
    } catch (e) {
      logErr("renderChatters failed: " + (e && e.message));
    }
  }

  // ---- Goal bars + polls ----
  let lastGoals = [];
  function renderGoals(list) {
    try {
      lastGoals = Array.isArray(list) ? list : [];
      const box = document.getElementById("gl");
      const rows = document.getElementById("glRows");
      if (!box || !rows) return;
      box.hidden = EDIT ? !isOn("gl") : !(lastGoals.length && isOn("gl"));
      while (rows.firstChild) rows.removeChild(rows.firstChild);
      for (let i = 0; i < lastGoals.length; i++) {
        const g = lastGoals[i];
        rows.appendChild(barRow(g.name, g.current + " / " + g.target,
          Math.min(100, 100 * (g.current || 0) / Math.max(1, g.target)), g.color || "#9fb4ff"));
      }
    } catch (e) { logErr("renderGoals failed: " + (e && e.message)); }
  }

  // ---- Counters (per-game tallies) ----
  let lastCounters = [];
  let currentGameTitle = "";
  function counterRow(name, value, color) {
    const row = document.createElement("div");
    row.className = "cnt-row";
    const nm = document.createElement("span"); nm.className = "cnt-name"; nm.textContent = name;
    const val = document.createElement("span"); val.className = "cnt-val"; val.textContent = value;
    val.style.color = color || "#9fb4ff";
    row.appendChild(nm); row.appendChild(val);
    return row;
  }
  // A counter applies to the current game if it lists that game, or lists none (= all games).
  function counterApplies(c) {
    if (!c.games || c.games.length === 0) return true;
    var t = (currentGameTitle || "").toLowerCase();
    for (var i = 0; i < c.games.length; i++) if ((c.games[i] || "").toLowerCase() === t) return true;
    return false;
  }
  function counterValue(c) {
    return (c.values && Object.prototype.hasOwnProperty.call(c.values, currentGameTitle)) ? c.values[currentGameTitle] : 0;
  }
  function renderCounters(list) {
    try {
      if (Array.isArray(list)) lastCounters = list;
      const box = document.getElementById("cnt");
      const rows = document.getElementById("cntRows");
      if (!box || !rows) return;
      const shown = EDIT ? lastCounters : lastCounters.filter(counterApplies);
      box.hidden = EDIT ? !isOn("cnt") : !(shown.length && isOn("cnt"));
      while (rows.firstChild) rows.removeChild(rows.firstChild);
      for (let i = 0; i < shown.length; i++) rows.appendChild(counterRow(shown[i].name, counterValue(shown[i]), shown[i].color));
    } catch (e) { logErr("renderCounters failed: " + (e && e.message)); }
  }

  let lastPoll = null;
  function renderPoll(p) {
    try {
      lastPoll = p && p.question ? p : null;
      const box = document.getElementById("poll");
      const q = document.getElementById("pollQ");
      const st = document.getElementById("pollState");
      const rows = document.getElementById("pollRows");
      if (!box || !rows) return;
      box.hidden = EDIT ? !isOn("poll") : !(lastPoll && isOn("poll"));
      while (rows.firstChild) rows.removeChild(rows.firstChild);
      if (!lastPoll) { if (q) q.textContent = ""; if (st) st.textContent = ""; return; }
      if (q) q.textContent = lastPoll.question;
      if (st) st.textContent = lastPoll.open ? "vote with !vote #" : "FINAL";
      const opts = Array.isArray(lastPoll.options) ? lastPoll.options : [];
      let total = 0;
      for (let i = 0; i < opts.length; i++) total += (opts[i].votes || 0);
      for (let i = 0; i < opts.length; i++) {
        const o = opts[i];
        const pct = total > 0 ? Math.round(100 * (o.votes || 0) / total) : 0;
        const row = barRow((i + 1) + ". " + o.text, (o.votes || 0) + " (" + pct + "%)",
          pct, o.winner ? "#f8d878" : "#9fb4ff");
        const numEl = row.querySelector(".bar-label span");
        rows.appendChild(row);
      }
    } catch (e) { logErr("renderPoll failed: " + (e && e.message)); }
  }

  // ---- Activity feed (gifts / follows / subs / redeems) ----

  let fxCanvas = null, fxCtx = null, fxParts = [], fxRaf = 0, fxUntil = 0;
  function fxEnsureCanvas() {
    if (fxCanvas) return;
    fxCanvas = document.createElement("canvas");
    fxCanvas.id = "fxcanvas";
    document.body.appendChild(fxCanvas);
    fxCtx = fxCanvas.getContext("2d");
  }
  function fxLoop() {
    fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight;
    const now = Date.now();
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = fxParts.length - 1; i >= 0; i--) {
      const p = fxParts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 1;
      if (p.life <= 0 || p.y > fxCanvas.height + 30) { fxParts.splice(i, 1); continue; }
      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      fxCtx.fillStyle = p.c;
      if (p.shape === "r") fxCtx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      else { fxCtx.beginPath(); fxCtx.arc(0, 0, p.s / 2, 0, 6.283); fxCtx.fill(); }
      fxCtx.restore();
    }
    if (fxParts.length || now < fxUntil) fxRaf = requestAnimationFrame(fxLoop);
    else { fxRaf = 0; fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }
  }
  function fxStart() { if (!fxRaf) fxRaf = requestAnimationFrame(fxLoop); }
  const FX_COLORS = ["#9fb4ff", "#f8d878", "#ffffff", "#4aa3c4", "#c44a7c", "#9146FF", "#ff6b4a"];

  function fxConfetti(durMs) {
    fxEnsureCanvas();
    fxUntil = Date.now() + (durMs || 2500);
    const w = window.innerWidth;
    const burst = function () {
      for (let i = 0; i < 90; i++) {
        fxParts.push({
          x: Math.random() * w, y: -20 - Math.random() * 60,
          vx: (Math.random() - 0.5) * 3.2, vy: 1.5 + Math.random() * 3.2, g: 0.06,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
          s: 6 + Math.random() * 7, c: FX_COLORS[(Math.random() * FX_COLORS.length) | 0],
          shape: "r", life: 260,
        });
      }
    };
    burst(); setTimeout(burst, 420); setTimeout(burst, 900);
    fxStart();
  }

  function fxFireworks(durMs) {
    fxEnsureCanvas();
    fxUntil = Date.now() + (durMs || 3000);
    const w = window.innerWidth, h = window.innerHeight;
    const boom = function () {
      const cx = w * (0.2 + Math.random() * 0.6), cy = h * (0.15 + Math.random() * 0.4);
      const col = FX_COLORS[(Math.random() * FX_COLORS.length) | 0];
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * 6.283, sp = 2 + Math.random() * 5;
        fxParts.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.045,
          rot: 0, vr: 0, s: 3 + Math.random() * 3.4, c: col, shape: "c", life: 70 + Math.random() * 40,
        });
      }
    };
    boom(); setTimeout(boom, 500); setTimeout(boom, 1000); setTimeout(boom, 1600);
    fxStart();
  }

  function fxShake() {
    const stage = document.getElementById("stage");
    if (!stage) return;
    stage.style.setProperty("--sscale", String(stageScale));
    stage.classList.remove("shake");

    stage.classList.add("shake");
    setTimeout(function () { stage.classList.remove("shake"); }, 1300);
  }

  let fxVidEl = null;
  function playVideo(url, volume) {
    if (!url) return;
    if (!fxVidEl) fxVidEl = document.getElementById("fxvideo");
    if (!fxVidEl) return;
    try {
      fxVidEl.volume = Math.max(0, Math.min(1, (typeof volume === "number" ? volume : 100) / 100));
      fxVidEl.src = url;
      fxVidEl.classList.add("show");
      fxVidEl.onended = function () { fxVidEl.classList.remove("show"); fxVidEl.removeAttribute("src"); };
      fxVidEl.onerror = function () { fxVidEl.classList.remove("show"); };
      var p = fxVidEl.play();
      if (p && p.catch) p.catch(function () { /* autoplay guard; muted retry */
        fxVidEl.muted = true; fxVidEl.play().catch(function () {});
      });
    } catch (e) { logErr("video failed: " + (e && e.message)); }

  // ---- streamer voice-morph countdown pill ----
  let morphTimer = null;
  function showMorph(name, seconds) {
    const pill = document.getElementById("morphpill");
    if (!pill) return;
    if (morphTimer) { clearInterval(morphTimer); morphTimer = null; }
    if (!name || seconds <= 0) { pill.classList.remove("show"); return; }
    const mn = pill.querySelector(".mn");
    const mt = pill.querySelector(".mt");
    mn.textContent = name;
    let left = Math.max(0, seconds | 0);
    const fmt = function (s) {
      const m = Math.floor(s / 60), r = s % 60;
      return m + ":" + (r < 10 ? "0" : "") + r;
    };
    mt.textContent = fmt(left);
    pill.classList.add("show");
    morphTimer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(morphTimer); morphTimer = null;
        pill.classList.remove("show");
      } else {
        mt.textContent = fmt(left);
      }
    }, 1000);
  }

    while (elChatMsgs.childElementCount > CONFIG.maxMessages) {

  // ---- Scroll: auto-stick to bottom unless the viewer scrolled up ----
  function onScroll() {
    const dist = elChatWrap.scrollHeight - elChatWrap.clientHeight - elChatWrap.scrollTop;
    autoScroll = dist <= CONFIG.scrollThresholdPx;
  }
  function scheduleScroll() {
    if (!autoScroll || scrollRaf) return;

  // =========================================================================
  //  Visibility / focus (OBS scene switching)
  // =========================================================================
  function onVisibilityChange() {
    if (document.visibilityState === "hidden") {
      hidden = true;
      stopHeartbeat();                 // pause non-critical work
      log("hidden (scene inactive) — paused");
    } else {
      hidden = false;
      log("visible (scene active) — resuming");
      // Resume: reconnect if needed, otherwise just re-prime heartbeat + scroll.
      if (!ws || ws.readyState > 1) {   // closing/closed
        backoffStep = 0;
        pendingReconnect = false;
        connect();
      } else if (ws.readyState === 1) {
        startHeartbeat();
        scheduleScroll();
      }
      if (pendingReconnect) { pendingReconnect = false; backoffStep = 0; connect(); }
    }
  }
  // focus/blur: only act on focus (an OBS source is ~never the focused window,
  // so we must NOT pause on blur or we'd pause permanently).
  function onFocus() {
    if (!hidden && (!ws || ws.readyState > 1)) { backoffStep = 0; connect(); }
  }

  // =========================================================================
  //  Long-session housekeeping
  // =========================================================================
  function maintenance() {
    if (hidden) return;                 // paused while not visible
    const now = Date.now();

    // Optional periodic clear.
    if (CONFIG.enablePeriodicClear) {
      const everyMs = CONFIG.clearListIntervalHours * 3600 * 1000;
      if (now - lastClearAt >= everyMs) {
        lastClearAt = now;
        clearChat();
        log("periodic clear");
      }
    }

    // Soft self-reload after a long uptime, but only during a quiet moment.
    if (now - pageStart >= CONFIG.softReloadAfterMs &&
        now - lastMessageAt >= CONFIG.quietPeriodMs) {
      log("soft reload (long uptime, quiet) — reloading");
      manualClose = true;               // mark our own close as intentional
      try { if (ws) ws.close(1000, "soft-reload"); } catch (e) {}
      location.reload();
    }
  }

  // =========================================================================
  //  Scaling — author at designWidth, scale uniformly to the OBS source size.
  // =========================================================================
  const CANVAS_W = 1280, CANVAS_H = 720;
  let stageScale = 1;
  function applyScale() {
    const stage = document.getElementById("stage");
    if (!stage) return;
    stageScale = Math.min(window.innerWidth / CANVAS_W, window.innerHeight / CANVAS_H);
    stage.style.transform = "translate(-50%,-50%) scale(" + stageScale + ")";
  }
  function onResize() {

  // =========================================================================

  // =========================================================================
  const ELEMENTS = ["ch", "chat", "cl", "gl", "poll", "feed", "cnt", "party"];

                 "Georgia", "Times New Roman", "Courier New", "Consolas",

  let layout = clone(DEFAULT_LAYOUT);

  let editorSetFont = null; // set by initEditor: selects a font in the picker, adding it if missing

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // Element enabled? Missing "on" means true (backward compatible with older layouts).
  function isOn(k) { return !layout[k] || layout[k].on !== false; }

  let lastChattersData = null;   // latest chatters frame, for visibility recalc

  function applyLayout(next) {
    if (next && typeof next === "object") {
      const merged = clone(DEFAULT_LAYOUT);
      for (const k of ELEMENTS) {
        if (next[k]) for (const p in next[k]) merged[k][p] = next[k][p];

  function syncElemChecks() {
    const box = document.getElementById("ebElems");
    if (!box) return;
    const inputs = box.querySelectorAll("input[data-el]");
    for (let i = 0; i < inputs.length; i++) {
      inputs[i].checked = isOn(inputs[i].dataset.el);
    }
  }

  function applyElementVisibility() {
    const chat = document.getElementById("chat");
    const cl = document.getElementById("cl");
    if (EDIT) {
      // Editor: disabled elements disappear from the canvas entirely.
      for (const k of ELEMENTS) {
        const el = document.getElementById(k);
        if (el) el.hidden = !isOn(k);
      }
      syncElemChecks();
      return;
    }
    // Enabled elements are always on screen; only their content changes with state.
    const ch = document.getElementById("ch");
    if (ch) ch.hidden = !isOn("ch");
    if (chat) chat.hidden = !isOn("chat");
    if (cl) cl.hidden = !(isOn("cl") && lastChattersData && lastChattersData.showList);
    const gl = document.getElementById("gl");
    if (gl) gl.hidden = !(isOn("gl") && lastGoals.length);
    const pollEl = document.getElementById("poll");
    if (pollEl) pollEl.hidden = !(isOn("poll") && lastPoll);
    const feedEl = document.getElementById("feed");
    if (feedEl) feedEl.hidden = !(isOn("feed") && lastActivity.length);
    const cntEl = document.getElementById("cnt");
    if (cntEl) cntEl.hidden = !(isOn("cnt") && lastCounters.some(counterApplies));
    const partyEl = document.getElementById("party");
    if (partyEl) partyEl.hidden = !isOn("party");   // content comes from its own bot feed
    lastStateSig = "";   // let the next state frame re-fill content
  }

  function applyBox(k) {
    const el = document.getElementById(k);
    if (!el) return;
    const c = layout[k];
    el.style.left = c.x + "px";
    el.style.top = c.y + "px";
    el.style.width = c.w + "px";

    const bgo = (typeof c.bgo === "number" ? Math.max(0, Math.min(100, c.bgo)) : 100) / 100;

    else {

    }

    const fsel = document.getElementById("ebFont");
    function populateFonts(list) {
      const current = selEl ? (layout[selEl].font || "") : "";
      fsel.innerHTML = "";
      const opts = [""].concat(list.filter(function (f) { return f; }));
      for (const f of opts) {
        const o = document.createElement("option");
        o.value = f; o.textContent = f || "(default)";
        if (f) o.style.fontFamily = "'" + f + "'";
        fsel.appendChild(o);
      }
      setFontValue(current);
    }
    function setFontValue(font) {
      fsel.value = font || "";

        // Saved font isn't in the list (e.g. uninstalled) — keep it selectable anyway.
        const o = document.createElement("option");

    populateFonts(FONTS);
    // Ask the app for the fonts actually installed on this PC (same machine as OBS,
    // so anything listed renders on the overlay too). Falls back to the built-in list.
    fetch("/fonts")
      .then(function (r) { return r.json(); })
      .then(function (list) {
        if (Array.isArray(list) && list.length) populateFonts(list);
      })
      .catch(function () { /* keep fallback list */ });

    fsel.addEventListener("change", function () {
      if (!selEl) return; layout[selEl].font = fsel.value; applyBox(selEl); scheduleSave();
    });
    document.getElementById("ebSize").addEventListener("input", function () {
      if (!selEl) return;
      let n = parseInt(this.value, 10); if (isNaN(n)) return;
      layout[selEl].size = Math.max(8, Math.min(200, n)); applyBox(selEl); scheduleSave();
    });
    document.getElementById("ebColor").addEventListener("input", function () {
      if (!selEl) return; layout[selEl].color = this.value; applyBox(selEl); scheduleSave();
    });
    document.getElementById("ebBgo").addEventListener("input", function () {
      if (!selEl) return;
      const v = parseInt(this.value, 10) || 0;
      layout[selEl].bgo = v;
      document.getElementById("ebBgoVal").textContent = v + "%";
      applyBox(selEl); scheduleSave();
    });

    // Element on/off checkboxes (add or remove blocks from the overlay).
    const elemsBox = document.getElementById("ebElems");
    for (const k of ELEMENTS) {
      const row = document.createElement("div"); row.className = "ebElemRow";
      const lab = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.dataset.el = k;
      cb.checked = isOn(k);
      cb.addEventListener("change", function () {
        layout[k].on = cb.checked;
        applyElementVisibility();
        scheduleSave();
        flashSaved((cb.checked ? "Added " : "Removed ") + ELEMENT_NAMES[k]);
      });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(ELEMENT_NAMES[k]));
      // Per-element reset: restore just this element's position & size to the default.
      const rst = document.createElement("button");
      rst.className = "ebElemRst"; rst.textContent = "↺";
      rst.title = "Reset " + ELEMENT_NAMES[k] + " to its default position & size";
      rst.addEventListener("click", (function (key) {
        return function () {
          const d = DEFAULT_LAYOUT[key]; if (!d) return;
          layout[key].x = d.x; layout[key].y = d.y; layout[key].w = d.w; layout[key].h = d.h;
          applyBox(key);
          if (selEl === key) selectEl(key);
          scheduleSave();
          flashSaved("Reset " + ELEMENT_NAMES[key] + " position");
        };
      })(k));
      row.appendChild(lab); row.appendChild(rst);
      elemsBox.appendChild(row);
    }

    document.getElementById("ebPresetSave").addEventListener("click", savePresetClick);
    document.getElementById("ebReset").addEventListener("click", function () {
      applyLayout(clone(DEFAULT_LAYOUT)); selectEl(selEl || "ch"); scheduleSave(); flashSaved("Reset to default");
    });
    renderPresets();

    for (const k of ELEMENTS) attachDragResize(k);
    selectEl("ch");
  }

  function attachDragResize(k) {
    const el = document.getElementById(k);
    const rz = el.querySelector(".rz");

    el.addEventListener("pointerdown", function (e) {
      if (e.target.classList.contains("rz")) return;   // resize is separate
      selectEl(k);
      const sx = e.clientX, sy = e.clientY, ox = layout[k].x, oy = layout[k].y;
      el.setPointerCapture(e.pointerId);
      function move(ev) {
        layout[k].x = Math.round(ox + (ev.clientX - sx) / stageScale);
        layout[k].y = Math.round(oy + (ev.clientY - sy) / stageScale);
        applyBox(k);
      }
      function up() {
        try { el.releasePointerCapture(e.pointerId); } catch (x) {}
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        scheduleSave();
      }
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
      e.preventDefault();
    });

    rz.addEventListener("pointerdown", function (e) {
      selectEl(k);
      const sx = e.clientX, sy = e.clientY, ow = layout[k].w, oh = layout[k].h;
      rz.setPointerCapture(e.pointerId);
      function move(ev) {
        layout[k].w = Math.max(60, Math.round(ow + (ev.clientX - sx) / stageScale));
        layout[k].h = Math.max(40, Math.round(oh + (ev.clientY - sy) / stageScale));
        applyBox(k);
      }
      function up() {
        try { rz.releasePointerCapture(e.pointerId); } catch (x) {}
        rz.removeEventListener("pointermove", move);
        rz.removeEventListener("pointerup", up);
        scheduleSave();
      }
      rz.addEventListener("pointermove", move);
      rz.addEventListener("pointerup", up);
      e.stopPropagation();
      e.preventDefault();
    });
  }

  function setStatus(up) {
    if (!CONFIG.showStatusDot || !elStatus) return;
    elStatus.classList.toggle("down", !up);
    // Only flash the dot while down/connecting; hide it once healthy so it does
    // not clutter the stream. It is never a permanent error screen.
    elStatus.classList.toggle("show", !up);
  }

  // =========================================================================
  //  Init
  // =========================================================================
  function init() {
    elCh = document.getElementById("ch");
    elChRows = document.getElementById("chRows");
    elChatWrap = document.getElementById("chatWrap");
    elChatMsgs = document.getElementById("chatMsgs");
    elStatus = document.getElementById("status");
    dbg.el = document.getElementById("debug");

    elChatWrap.addEventListener("scroll", onScroll, { passive: true });

    document.addEventListener("visibilitychange", onVisibilityChange);
    window.addEventListener("focus", onFocus);
    window.addEventListener("blur", function () { log("blur (ignored for pause)"); });

    // Ctrl+D toggles the debug overlay.
    window.addEventListener("keydown", function (e) {
      if (e.ctrlKey && (e.key === "d" || e.key === "D")) {
        e.preventDefault();
        dbg.toggle();
      }
    });

    window.addEventListener("resize", onResize);
    applyScale();
    applyLayout();                 // position boxes at defaults (a snapshot may override)
    if (EDIT) initEditor();
    initParty();                   // Tavern Tales party sprite overlay (fetches from the bot)

    hidden = (document.visibilityState === "hidden");
    maintenanceTimer = setInterval(maintenance, CONFIG.maintenanceIntervalMs);

    log("init (uptime clock started)");
    connect();
  }

  // ---- Tavern Tales party sprite overlay ------------------------------------
  // Loads the sprite engine from the companion bot and renders recently-active
  // heroes doing what they're doing in the game, into the "Party" element's canvas.
  var PARTY_DEMO = [
    { name: "Aldric", action: "fight", look: { skin: "#f1c9a5", hair: "#6b4423", outfit: "#a54a4a", style: "armor", weapon: "sword" } },
    { name: "Mira",   action: "mine",  look: { skin: "#c68642", hair: "#8e44ad", outfit: "#8e6fa5", style: "robe",  weapon: "staff" } },
    { name: "Fen",    action: "craft", look: { skin: "#e6b892", hair: "#c9a227", outfit: "#4aa55e", style: "tunic", weapon: "hammer" } }
  ];
  var partyData = [];
  var partyRaid = null;
  function initParty() {
    var base = (CONFIG.partyBase || "").replace(/\/+$/, "");
    var canvas = document.getElementById("partyCanvas");
    var hint = document.getElementById("partyHint");
    if (!canvas) return;
    if (!base) { if (hint) hint.textContent = "Connect the Discord bot in Settings, then this shows your Tavern Tales party."; startPartyLoop(canvas); return; }
    if (hint) hint.textContent = "Party (Tavern Tales) — drag to place. Active players will appear here.";
    var s = document.createElement("script");
    s.src = base + "/party/engine.js";
    s.onload = function () {
      startPartyLoop(canvas);
      var poll = function () {
        fetch(base + "/party/api", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) { partyData = (d && d.party) || []; partyRaid = (d && d.raid) || null; })
          .catch(function () {});
      };
      poll(); setInterval(poll, CONFIG.partyPollMs || 2500);
    };
    s.onerror = function () { if (hint) hint.textContent = "Couldn't reach the bot at " + base + "."; startPartyLoop(canvas); };
    document.head.appendChild(s);
  }
  function startPartyLoop(canvas) {
    function frame(now) {
      var w = canvas.clientWidth || canvas.offsetWidth || 0, h = canvas.clientHeight || canvas.offsetHeight || 0;
      if (w > 0 && h > 0) {
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        var cw = Math.floor(w * dpr), ch = Math.floor(h * dpr);
        if (canvas.width !== cw) canvas.width = cw;
        if (canvas.height !== ch) canvas.height = ch;
        if (typeof TT_drawParty === "function") {
          var draw = partyData.length ? partyData : (EDIT && !partyRaid ? PARTY_DEMO : []);
          TT_drawParty(canvas, draw, now, partyRaid);
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
